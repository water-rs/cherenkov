[package]
name = "cherenkov-gpu"
version = "0.0.0"
description = "wgpu backend for the Cherenkov 2D rendering engine"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
filtrate = { path = "../filtrate" }
filtrate-core = { path = "../filtrate/core" }
cherenkov = { path = ".." }
wgpu = "30.0.1"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
kurbo = "0.13"
skrifa = "0.44"
half = "2"
thiserror = "2"
tracing = "0.1"
rustc-hash = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[build-dependencies]
# The WGSL engine shaders are compiled once at build time (issue #57), at
# the naga version wgpu 30 links.
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out", "msl-out"] }

[dev-dependencies]
cherenkov-oracle = { path = "../oracle" }
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out", "msl-out", "hlsl-out"] }

cherenkov = { path = "..", features = ["testing"] }
nami = { version = "0.11.1", default-features = false, features = ["std", "kurbo"] }

[lints]
workspace = true
