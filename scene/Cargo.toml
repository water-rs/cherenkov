[package]
name = "cherenkov-scene"
version = "0.0.0"
description = "Engine-neutral scene format for the Cherenkov correctness and performance suite"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Tooling for authoring the corpus: text shaping with parley and font
# subsetting with skera. Only needed by the corpus binaries.
generator = [
    "dep:parley",
    "dep:fontique",
    "dep:skera",
    "dep:skrifa",
    "dep:read-fonts",
    "dep:png",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[dependencies]
kurbo = { version = "0.13", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
blake3 = "1"
thiserror = "2"
parley = { version = "0.11", optional = true }
fontique = { version = "0.11", optional = true }
skera = { version = "0.7", optional = true }
skrifa = { version = "0.44", optional = true }
read-fonts = { version = "0.44", optional = true }
png = { version = "0.18", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["fmt"] }

[[bin]]
name = "generate-corpus"
path = "src/bin/generate_corpus.rs"
required-features = ["generator"]

[[bin]]
name = "prepare-fonts"
path = "src/bin/prepare_fonts.rs"
required-features = ["generator"]
