[package]
name = "cherenkov"
version = "0.0.0"
description = "GPU 2D rendering engine for modern hardware"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[workspace]
resolver = "3"
members = [".", "shader"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/water-rs/cherenkov"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[lints]
workspace = true
