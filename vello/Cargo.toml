[package]
name = "cherenkov-vello"
version = "0.0.0"
description = "Transitional Vello backend for the Cherenkov 2D rendering engine"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
cherenkov = { path = ".." }
filtrate = { path = "../filtrate" }
# The fork pinned in the workspace `[patch.crates-io]` declares 0.9.0.
vello = { version = "0.9" }
wgpu = "29"
pollster = "0.4"
kurbo = "0.13"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
skrifa = "0.44"

[dev-dependencies]
# Real X windows for the windowed-surface present tests.
x11rb = { version = "0.13", default-features = false, features = ["dl-libxcb"] }
raw-window-handle = "0.6"

[lints]
workspace = true
