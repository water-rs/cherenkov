name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # wgpu needs EGL/GLES headers to build, and the runtime tests need a
      # software Vulkan implementation (lavapipe) since no runner has a GPU.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl-dev libgbm-dev libwayland-dev \
            libxkbcommon-dev mesa-vulkan-drivers libvulkan1 \
            libfontconfig1-dev
      # wgpu's DX12 backend compiles shaders with `dxc` when it finds it on the
      # PATH (`Dx12Compiler::Auto`), which the runner image does not carry.
      - name: Install DirectX Shader Compiler
        if: runner.os == 'Windows'
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: scenes/fonts/_full
          # The pin list lives in fetch-fonts.py, so the file is the key.
          key: scenes-fonts-${{ hashFiles('scenes/fonts/tools/fetch-fonts.py') }}
      # scenes/{fonts,corpus,perf} are generated, not committed; the
      # workspace tests read them. The pinned font tools need Python >= 3.10
      # in a writable environment, which runner Pythons are not (too old or
      # externally managed); uv supplies both.
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Generate the scene tree
        shell: bash
        run: |
          set -euo pipefail
          uv run --python 3.12 --with-requirements scenes/fonts/tools/requirements.txt \
            python scenes/tools/generate.py
      - if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # `filtrate` with `default-features = false` must stay buildable with no
      # wgpu stack in its normal dependency graph; one leg covers it.
      - if: runner.os == 'Linux'
        run: cargo clippy --locked -p filtrate --no-default-features --all-targets -- -D warnings
      # The corpus generator sits behind `generator`, which `--all-targets`
      # alone does not reach; lint it too (its output is pinned byte-identical).
      # Its font stack links the system fontconfig, and the generator is
      # platform-independent code, so one Linux leg covers it.
      - if: runner.os == 'Linux'
        run: cargo clippy --locked -p cherenkov-scene --all-targets --features generator -- -D warnings
      - uses: taiki-e/install-action@nextest
      # `webgl` is the only non-default feature and intentionally fails to
      # compile off wasm, so `--all-features` cannot be used here; the wasm
      # job exercises it.
      - run: cargo nextest run --locked --workspace --no-tests=pass
      - run: cargo test --locked --workspace --doc

  wasm:
    name: Check / wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The scene generator's font stack links the system fontconfig.
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/cache@v4
        with:
          path: scenes/fonts/_full
          key: scenes-fonts-${{ hashFiles('scenes/fonts/tools/fetch-fonts.py') }}
      # cherenkov's `testing` feature and the engine tests embed generated
      # fonts, so compiling the test targets needs the tree.
      - name: Generate the scene tree
        run: |
          set -euo pipefail
          uv run --python 3.12 --with-requirements scenes/fonts/tools/requirements.txt \
            python scenes/tools/generate.py
      - run: cargo clippy --locked -p filtrate --target wasm32-unknown-unknown --all-features -- -D warnings
      - run: cargo clippy --locked -p cherenkov-gpu --lib --test browser --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --locked -p cherenkov-cpu --all-targets --target wasm32-unknown-unknown -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The floor is the highest `rust-version` any workspace member declares,
      # read from the manifests rather than written twice: a hardcoded version
      # in CI drifts from the manifests and then gates a number nobody
      # declared.
      - name: Read rust-version from the workspace manifests
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          version="$(find . -name Cargo.toml -not -path './target/*' \
            -exec grep -h '^rust-version = ' {} + \
            | sed 's/^rust-version = "\(.*\)"/\1/' | sort -V | tail -n 1)"
          if [ -z "$version" ]; then
            echo "::error::no workspace member declares rust-version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Installing a toolchain is not building with it: the action only
          # sets the rustup default, and this repository's
          # `rust-toolchain.toml` overrides the default for every cargo
          # invocation inside the checkout. Without this env var the job
          # would compile on `stable` and prove nothing about the floor.
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl-dev libgbm-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      # Proof in the log that the floor is what compiled, so a later change to
      # the pin or to the action cannot quietly make this a second stable run.
      - name: Show the toolchain this job builds with
        run: rustc --version && cargo --version
      - run: cargo check --locked --workspace

  bench-corpus:
    name: Bench / corpus on CPU adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # skia-safe's prebuilt Linux binaries link the system freetype and
      # fontconfig, which the runner does not ship. The cherenkov adapter
      # tests render on lavapipe, which needs the Vulkan loader and Mesa
      # drivers.
      - name: Skia link dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers libvulkan1
      - uses: actions/cache@v4
        with:
          path: scenes/fonts/_full
          key: scenes-fonts-${{ hashFiles('scenes/fonts/tools/fetch-fonts.py') }}
      # scenes/{fonts,corpus,perf} are generated, not committed; the
      # corpus render below and the bench tests read them. The pinned font
      # tools need Python >= 3.10 in a writable environment, which uv
      # supplies (runner Pythons may be externally managed).
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Generate the scene tree
        run: |
          set -euo pipefail
          uv run --python 3.12 --with-requirements scenes/fonts/tools/requirements.txt \
            python scenes/tools/generate.py
      # The bench adapters are all feature-gated, so the default-feature
      # clippy in `check` never compiles them — lint them here, on the
      # dependency graph this job already warms.
      - name: Clippy / all adapter features together
        run: |
          cargo clippy --locked -p cherenkov-bench --all-targets \
            --features vello-classic,vello-hybrid,vello-cpu,skia,cherenkov,cherenkov-cpu -- -D warnings
      - uses: taiki-e/install-action@cargo-hack
      # `skia-metal` is Apple-only; every other adapter must lint alone.
      - name: Clippy / each adapter feature alone
        run: |
          cargo hack clippy --locked -p cherenkov-bench --each-feature \
            --exclude-features skia-metal --all-targets -- -D warnings
      - uses: taiki-e/install-action@nextest
      - name: Bench adapter tests (cherenkov, cherenkov-cpu)
        run: cargo nextest run --locked -p cherenkov-bench --features cherenkov,cherenkov-cpu --no-tests=pass
      - run: cargo build --locked --release -p cherenkov-bench --features vello-cpu,skia
      # The oracle reference depends only on the scene; build it once for
      # both passes below (#218).
      - name: Render the corpus reference
        run: |
          ./target/release/cherenkov-bench reference \
            --corpus scenes/corpus --out-dir out/reference
      - name: Render the corpus on CPU adapters
        run: |
          set -euo pipefail
          for engine in vello-cpu skia-cpu; do
            ./target/release/cherenkov-bench render --engine "$engine" \
              --corpus scenes/corpus --out-dir "out/$engine" \
              --reference out/reference
          done
          python3 - <<'PY'
          import glob, json, sys
          files = glob.glob('out/*/render-*.json')
          # Every corpus scene produces a report (metrics or unsupported).
          scenes = {json.load(open(f))['scene'] for f in files}
          corpus = {p.split('/')[-2] for p in glob.glob('scenes/corpus/*/scene.json')}
          missing = corpus - scenes
          assert not missing, f'scenes without a report: {missing}'
          measured = [f for f in files if 'metrics' in json.load(open(f))]
          assert measured, 'no metrics JSON produced'
          for f in files:
              d = json.load(open(f))
              assert 'info' in d and d['info']['crate_version'], f'{f} lacks provenance'
          print(f'{len(files)} reports ({len(measured)} measured) across {len(scenes)} scenes')
          PY

  bench-macos-metal:
    name: Bench / corpus on Metal adapters
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: scenes/fonts/_full
          key: scenes-fonts-${{ hashFiles('scenes/fonts/tools/fetch-fonts.py') }}
      # scenes/{fonts,corpus,perf} are generated, not committed; the
      # corpus render and perf-scene measure below read them. The pinned
      # font tools need Python >= 3.10 in a writable environment, which uv
      # supplies (the runner's Homebrew Python is externally managed).
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Generate the scene tree
        run: |
          set -euo pipefail
          uv run --python 3.12 --with-requirements scenes/fonts/tools/requirements.txt \
            python scenes/tools/generate.py
      - name: Clippy / Metal adapter features
        run: |
          cargo clippy --locked -p cherenkov-bench --all-targets \
            --features skia-metal,vello-classic,vello-hybrid,cherenkov,cherenkov-cpu -- -D warnings
      - run: cargo build --locked --release -p cherenkov-bench --features skia-metal,vello-classic,vello-hybrid,cherenkov
      # Many timed frames of the map scene on a Metal device: the workload
      # that used to hang the render thread on Apple GPUs.
      - name: Measure the map scene on Metal
        run: |
          set -euo pipefail
          mkdir -p out/map-only
          cp -R scenes/perf/map out/map-only/map
          RUST_LOG=info,cherenkov_gpu=debug ./target/release/cherenkov-bench measure \
            --engine cherenkov --corpus out/map-only --frames 20 --warmup 5 --out out/measure-metal
      # #218: the oracle's f64 reference depends only on the scene, so the
      # six passes below share one parallel render instead of each
      # recomputing it; `render --reference` verifies the scene inputs
      # still match the cached file.
      - name: Render the corpus reference
        run: |
          ./target/release/cherenkov-bench reference \
            --corpus scenes/corpus --out-dir out/reference
      - name: Render the corpus on Metal adapters
        run: |
          set -euo pipefail
          for engine in skia-metal vello-classic vello-hybrid; do
            ./target/release/cherenkov-bench render --engine "$engine" \
              --corpus scenes/corpus --out-dir "out/$engine" \
              --reference out/reference
          done
          python3 - <<'PY'
          import glob, json
          files = glob.glob('out/*/render-*.json')
          # Every corpus scene produces a report (metrics or unsupported).
          scenes = {json.load(open(f))['scene'] for f in files}
          corpus = {p.split('/')[-2] for p in glob.glob('scenes/corpus/*/scene.json')}
          missing = corpus - scenes
          assert not missing, f'scenes without a report: {missing}'
          measured = [f for f in files if 'metrics' in json.load(open(f))]
          assert measured, 'no metrics JSON produced'
          for f in files:
              d = json.load(open(f))
              assert 'info' in d and d['info']['crate_version'], f'{f} lacks provenance'
          print(f'{len(files)} reports ({len(measured)} measured) across {len(scenes)} scenes')
          PY
      # #100: the corpus through the real presentation pass, one run per
      # output kind, compared to the oracle's matching presentation.
      - name: Render the presentation corpus
        run: |
          set -euo pipefail
          for kind in srgb-hw srgb-shader linear-p3; do
            ./target/release/cherenkov-bench render --engine cherenkov \
              --present "$kind" --corpus scenes/corpus \
              --out-dir "out/present-$kind" --reference out/reference
          done
          python3 - <<'PY'
          import glob, json
          files = glob.glob('out/present-*/render-*.json')
          scenes = {json.load(open(f))['scene'] for f in files}
          corpus = {p.split('/')[-2] for p in glob.glob('scenes/corpus/*/scene.json')}
          missing = corpus - scenes
          assert not missing, f'scenes without a report: {missing}'
          measured = [f for f in files if 'metrics' in json.load(open(f))]
          assert measured, 'no metrics JSON produced'
          for f in files:
              d = json.load(open(f))
              # An unsupported scene is presented nowhere; it names the missing feature instead.
              assert d.get('present') or d.get('unsupported'), f'{f} lacks the presentation record'
          print(f'{len(files)} presentation reports ({len(measured)} measured)')
          PY

  bench-android:
    name: Bench / aarch64-linux-android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install the Android NDK
        run: |
          curl -fsSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q /tmp/ndk.zip -d "$HOME"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r27d" >> "$GITHUB_ENV"
      # fontconfig for the scene generator's font stack.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/cache@v4
        with:
          path: scenes/fonts/_full
          key: scenes-fonts-${{ hashFiles('scenes/fonts/tools/fetch-fonts.py') }}
      # The device test links cherenkov's `testing` feature, which embeds
      # generated fonts, so it needs the tree.
      - name: Generate the scene tree
        run: |
          set -euo pipefail
          uv run --python 3.12 --with-requirements scenes/fonts/tools/requirements.txt \
            python scenes/tools/generate.py
      - name: Build cherenkov-bench for aarch64-linux-android
        run: |
          cargo ndk --target aarch64-linux-android --platform 30 \
            build --release -p cherenkov-bench \
            --features vello-classic,vello-hybrid,skia,cherenkov,cherenkov-cpu
          ls -l target/aarch64-linux-android/release/cherenkov-bench
      # The Vulkan external-frame device test (#166) runs on a Pixel 9
      # Pro over adb; CI builds and archives the prebuilt binary.
      - name: Build the Vulkan external-frame test for aarch64-linux-android
        run: |
          cargo ndk --target aarch64-linux-android --platform 30 \
            build --release -p cherenkov-gpu --test vulkan_external_android
          ls target/aarch64-linux-android/release/deps/vulkan_external_android-*
      - uses: actions/upload-artifact@v4
        with:
          name: vulkan-external-android-tests
          path: target/aarch64-linux-android/release/deps/vulkan_external_android-*
          if-no-files-found: error
