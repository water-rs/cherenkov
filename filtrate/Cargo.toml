[package]
name = "filtrate"
version = "0.2.1"
edition.workspace = true
rust-version = "1.95"
authors = ["Lexo Liu"]
readme = "README.md"
repository.workspace = true
description = "GPU texture filter library: built-in filters (blur, brightness, color matrix, ...) and runtime, built on filtrate-core."
keywords = ["gpu", "filter", "wgpu", "image", "video"]
categories = ["graphics", "multimedia::images", "rendering"]
license = "Apache-2.0 OR MIT"

# filtrate's lint policy is stricter than the workspace default: it warns on
# every clippy group (including `cargo` lints), undocumented unsafe blocks,
# and missing Debug impls. The first entries repeat the workspace lints
# because `[lints] workspace = true` cannot be combined with extra entries.
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
default = []
# WebGL2 backend support for wasm targets: turns on wgpu's `webgl` backend and
# routes spatial filters through a fragment pipeline, because WebGL2 has no
# compute shaders or storage textures. Enabling this feature for a non-wasm
# target is a compile error — native and WebGPU devices run the same code
# without it.
webgl = ["wgpu/webgl"]

[dependencies]
filtrate-core = { version = "0.2.0", path = "core" }
filtrate-derive = { version = "0.1.0", path = "derive" }
wgpu = "29.0.4"
shaderloom = "0.1.0"
bytemuck = { version = "1", features = ["derive"] }
num-traits = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
thiserror = "2.0.19"
tracing = "0.1.44"

# `std::time::Instant::now` panics on wasm32-unknown-unknown; web-time backs it
# with `performance.now()` there and delegates to std everywhere else.
[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1"

[build-dependencies]
shaderloom = { version = "0.1.0", features = ["build"] }

[dev-dependencies]
divan = "0.1"
pollster = "1.0"

[[bench]]
name = "filter_trait"
harness = false

[[bench]]
name = "gpu_runtime"
harness = false

# `shaderloom` is used directly by build.rs; cargo-machete 0.9 does not scan build.rs.
[package.metadata.cargo-machete]
ignored = ["shaderloom"]
