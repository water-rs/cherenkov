[package]
name = "cherenkov"
version = "0.0.0"
description = "GPU 2D rendering engine for modern hardware"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
testing = []

[dependencies]
web-time = "1"
color = { version = "0.3.3", features = ["serde"] }
filtrate-core = { path = "filtrate/core" }
kurbo = { version = "0.13.1", features = ["serde"] }
libm = "0.2"
nami-core = { version = "0.3.3", features = ["kurbo"] }
rustc-hash = "2"
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"
tracing = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]
nami = { version = "0.11.1", default-features = false, features = ["std", "kurbo"] }
serde_json = "1"

[workspace]
resolver = "3"
members = [
    ".",
    "filtrate",
    "filtrate/core",
    "filtrate/derive",
    "shader",
    "gpu",
    "cpu",
    "scene",
    "oracle",
    "bench",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/water-rs/cherenkov"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[lints]
workspace = true

# nami's `kurbo` feature (constant `Signal` for kurbo types) is unreleased:
# water-rs/nami#27. Move this pin to the merge commit on nami's dev, then to a
# released version.
[patch.crates-io]
nami = { git = "https://github.com/water-rs/nami", rev = "6908aac816de14ee5aff23bfffd7d2b109d08fea" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "6908aac816de14ee5aff23bfffd7d2b109d08fea" }

# wgpu 30.0.1's Metal backend reads the address of the kCGColorSpace* globals
# instead of their value and crashes in CGColorSpaceCreateWithName whenever a
# surface negotiates Extended Display P3 or BT.2100 (gfx-rs/wgpu#10175, fixed on
# trunk, not yet released for v30). The fork carries only that backport on the
# v30.0.1 tag; drop these entries once wgpu-hal 30.0.2 ships it.
naga = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
naga-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-apple = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-emscripten = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-wasm = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-hal = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-naga-bridge = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }

# The suite's vello baseline is the fork WaterUI and Hydrolysis actually ship,
# not crates.io. `vello` carries our Mali Vulkan device-loss fix
# (linebender/vello#1817, still open upstream) plus the glifo canonical-location
# hint-cache fix applied to vello_encoding's GlyphCache (branch
# `glifo-canonical-location-classic`, on the Mali rev). The sparse-strip
# crates and glifo sit on the same canonical-location fix at
# `glifo-canonical-location` — without it, an explicit all-default location
# (`[0, 0, …]`) never matched a stored hint entry and every glyph run repaid
# a HintingInstance reconfigure.
vello = { git = "https://github.com/lexoliu/vello", rev = "7f5e1ca5769a96dc4404b812e7fa0351499cd2c4" }
vello_hybrid = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
vello_common = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
vello_sparse_shaders = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
glifo = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
