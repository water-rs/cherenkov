[package]
name = "cherenkov-shader"
version = "0.0.0"
description = "Shader composer on naga IR, shared by Cherenkov and filtrate"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The same naga major version wgpu 29 links, so composed modules reach wgpu without conversion.
naga = { version = "29.0.4", features = ["wgsl-in", "wgsl-out", "msl-out", "spv-out"] }
thiserror = "2"

[dev-dependencies]
# naga's `Literal::F16` payload; the test evaluator reads it.
half = { version = "2.5", default-features = false }

[lints]
workspace = true
