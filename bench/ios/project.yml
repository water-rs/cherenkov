name: CherenkovBench
options:
  bundleIdPrefix: dev.cherenkov
targets:
  CherenkovBench:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cherenkov.bench
        INFOPLIST_FILE: Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: CherenkovBench-Bridging-Header.h
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # `libcherenkov_bench.a` comes from cargo — build it first:
        #   cargo build --release --target aarch64-apple-ios -p cherenkov-bench \
        #     --features cherenkov,vello-hybrid,vello-classic,skia-metal
        LIBRARY_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/../../target/aarch64-apple-ios/release
        OTHER_LDFLAGS: $(inherited) -lcherenkov_bench -lc++
