name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # wgpu needs EGL/GLES headers to build, and the runtime tests need a
      # software Vulkan implementation (lavapipe) since no runner has a GPU.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl-dev libgbm-dev libwayland-dev \
            libxkbcommon-dev mesa-vulkan-drivers libvulkan1
      # wgpu's DX12 backend compiles shaders with `dxc` when it finds it on the
      # PATH (`Dx12Compiler::Auto`), which the runner image does not carry.
      - name: Install DirectX Shader Compiler
        if: runner.os == 'Windows'
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@nextest
      # `webgl` is the only non-default feature and intentionally fails to
      # compile off wasm, so `--all-features` cannot be used here; the wasm
      # job exercises it.
      - run: cargo nextest run --locked --workspace --no-tests=pass
      - run: cargo test --locked --workspace --doc

  wasm:
    name: Check / wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p filtrate --target wasm32-unknown-unknown --all-features

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The floor is the highest `rust-version` any workspace member declares,
      # read from the manifests rather than written twice: a hardcoded version
      # in CI drifts from the manifests and then gates a number nobody
      # declared.
      - name: Read rust-version from the workspace manifests
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          version="$(find . -name Cargo.toml -not -path './target/*' \
            -exec grep -h '^rust-version = ' {} + \
            | sed 's/^rust-version = "\(.*\)"/\1/' | sort -V | tail -n 1)"
          if [ -z "$version" ]; then
            echo "::error::no workspace member declares rust-version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Installing a toolchain is not building with it: the action only
          # sets the rustup default, and this repository's
          # `rust-toolchain.toml` overrides the default for every cargo
          # invocation inside the checkout. Without this env var the job
          # would compile on `stable` and prove nothing about the floor.
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl-dev libgbm-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      # Proof in the log that the floor is what compiled, so a later change to
      # the pin or to the action cannot quietly make this a second stable run.
      - name: Show the toolchain this job builds with
        run: rustc --version && cargo --version
      - run: cargo check --locked --workspace

  bench-corpus:
    name: Bench / corpus on CPU adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # skia-safe's prebuilt Linux binaries link the system freetype and
      # fontconfig, which the runner does not ship.
      - name: Skia link dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev
      # The bench adapters are all feature-gated, so the default-feature
      # clippy in `check` never compiles them — lint them here, on the
      # dependency graph this job already warms.
      - name: Clippy / all adapter features together
        run: |
          cargo clippy --locked -p cherenkov-bench --all-targets \
            --features vello-classic,vello-hybrid,vello-cpu,skia,cherenkov -- -D warnings
      - uses: taiki-e/install-action@cargo-hack
      # `skia-metal` is Apple-only; every other adapter must lint alone.
      - name: Clippy / each adapter feature alone
        run: |
          cargo hack clippy --locked -p cherenkov-bench --each-feature \
            --exclude-features skia-metal --all-targets -- -D warnings
      - run: cargo build --locked --release -p cherenkov-bench --features vello-cpu,skia
      - name: Render the corpus on CPU adapters
        run: |
          set -euo pipefail
          for engine in vello-cpu skia-cpu; do
            ./target/release/cherenkov-bench render --engine "$engine" \
              --corpus scenes/corpus --out-dir "out/$engine"
          done
          python3 - <<'PY'
          import glob, json, sys
          files = glob.glob('out/*/render-*.json')
          # Every corpus scene produces a report (metrics or unsupported).
          scenes = {json.load(open(f))['scene'] for f in files}
          corpus = {p.split('/')[-2] for p in glob.glob('scenes/corpus/*/scene.json')}
          missing = corpus - scenes
          assert not missing, f'scenes without a report: {missing}'
          measured = [f for f in files if 'metrics' in json.load(open(f))]
          assert measured, 'no metrics JSON produced'
          for f in files:
              d = json.load(open(f))
              assert 'info' in d and d['info']['crate_version'], f'{f} lacks provenance'
          print(f'{len(files)} reports ({len(measured)} measured) across {len(scenes)} scenes')
          PY

  bench-macos-metal:
    name: Bench / corpus on Metal adapters
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy / Metal adapter features
        run: |
          cargo clippy --locked -p cherenkov-bench --all-targets \
            --features skia-metal,vello-classic,vello-hybrid,cherenkov -- -D warnings
      - run: cargo build --locked --release -p cherenkov-bench --features skia-metal,vello-classic,vello-hybrid,cherenkov
      # Many timed frames of the map scene on a Metal device: the workload
      # that used to hang the render thread on Apple GPUs.
      - name: Measure the map scene on Metal
        run: |
          set -euo pipefail
          mkdir -p out/map-only
          cp -R scenes/perf/map out/map-only/map
          RUST_LOG=info,cherenkov_gpu=debug ./target/release/cherenkov-bench measure \
            --engine cherenkov --corpus out/map-only --frames 20 --warmup 5 --out out/measure-metal
      - name: Render the corpus on Metal adapters
        run: |
          set -euo pipefail
          for engine in skia-metal vello-classic vello-hybrid; do
            ./target/release/cherenkov-bench render --engine "$engine" \
              --corpus scenes/corpus --out-dir "out/$engine"
          done
          python3 - <<'PY'
          import glob, json
          files = glob.glob('out/*/render-*.json')
          # Every corpus scene produces a report (metrics or unsupported).
          scenes = {json.load(open(f))['scene'] for f in files}
          corpus = {p.split('/')[-2] for p in glob.glob('scenes/corpus/*/scene.json')}
          missing = corpus - scenes
          assert not missing, f'scenes without a report: {missing}'
          measured = [f for f in files if 'metrics' in json.load(open(f))]
          assert measured, 'no metrics JSON produced'
          for f in files:
              d = json.load(open(f))
              assert 'info' in d and d['info']['crate_version'], f'{f} lacks provenance'
          print(f'{len(files)} reports ({len(measured)} measured) across {len(scenes)} scenes')
          PY

  bench-android:
    name: Bench / aarch64-linux-android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install the Android NDK
        run: |
          curl -fsSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q /tmp/ndk.zip -d "$HOME"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r27d" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Build cherenkov-bench for aarch64-linux-android
        run: |
          cargo ndk --target aarch64-linux-android --platform 30 \
            build --release -p cherenkov-bench \
            --features vello-classic,vello-hybrid,skia,cherenkov
          ls -l target/aarch64-linux-android/release/cherenkov-bench
