name: Release preflight

# crates.io versions are immutable, so the one unrecoverable mistake is
# publishing a version number that already exists while the crate behind it has
# changed. release-plz runs this check when preparing a release PR; this job
# exists so it cannot silently lapse.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semver:
    name: Local API vs published baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl-dev libgbm-dev libwayland-dev libxkbcommon-dev
      # cargo-semver-checks pins the baseline to an exact version, so it needs a
      # published version that still resolves — a crate can be in the index with
      # every version yanked, and then there is nothing to compare against.
      - id: baseline
        run: |
          set -euo pipefail
          if curl -sfL https://index.crates.io/fi/lt/filtrate | grep -q '"yanked":false'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No unyanked filtrate on crates.io; this release establishes the baseline."
          fi
      - if: steps.baseline.outputs.exists == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          # The action's default heuristic enables every non-"unstable"
          # feature — including `webgl`, which is an intentional
          # compile_error off wasm. The feature adds no cfg-gated API, so
          # default features cover the full public surface.
          feature-group: default-features
