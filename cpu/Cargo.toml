[package]
name = "cherenkov-cpu"
version = "0.0.0"
description = "CPU raster backend for the Cherenkov 2D rendering engine"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
cherenkov = { path = ".." }
kurbo = "0.13"
skrifa = "0.44"
half = "2"
thiserror = "2"
rayon = "1"

[dev-dependencies]
cherenkov = { path = "..", features = ["testing"] }
nami = { version = "0.11.1", default-features = false, features = ["std", "kurbo"] }

[lints]
workspace = true
